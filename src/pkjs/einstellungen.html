<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linie 8</title>
<style>
  body { margin: 0; padding: 16px 16px 40px; background: #111; color: #eee; font: 16px/1.4 -apple-system, Roboto, sans-serif; }
  h1 { font-size: 20px; color: #FFAA00; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #999; margin: 22px 0 8px; }
  .klein { font-size: 13px; color: #999; }
  h3 { font-size: 13px; color: #ccc; margin: 14px 0 6px; font-weight: normal; }
  .hinweis { font-size: 14px; color: #FFAA00; margin: 8px 0; }
  .fehler { font-size: 14px; color: #f66; margin: 8px 0; }
  ul.menue li { padding: 14px 10px; font-size: 17px; }
  ul.menue .pfeil { float: right; color: #FFAA00; font-size: 22px; line-height: 18px; }
  select { width: 100%; box-sizing: border-box; padding: 11px; font-size: 16px; border: 1px solid #444; border-radius: 8px; background: #222; color: #fff; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 12px; font-size: 17px; border: 1px solid #444; border-radius: 8px; background: #222; color: #fff; }
  button { padding: 11px 15px; font-size: 15px; border: 0; border-radius: 8px; background: #333; color: #fff; margin: 8px 6px 0 0; }
  button.haupt { background: #FFAA00; color: #000; font-weight: bold; }
  button.klein { padding: 7px 10px; font-size: 13px; color: #ddd; }
  button:disabled { opacity: .35; }
  ul { list-style: none; padding: 0; margin: 6px 0 0; }
  li { padding: 11px 10px; border-bottom: 1px solid #2a2a2a; }
  li.wahl { background: #3a2a00; }
  .karte { background: #1c1c1c; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .karte b { color: #FFAA00; }
  .marke { display: inline-block; background: #333; color: #FFAA00; border-radius: 4px; padding: 0 5px; margin: 0 3px 3px 0; font-size: 13px; font-weight: bold; }
  .gewaehlt { background: #1c1c1c; border-radius: 8px; padding: 10px 12px; }
  .gewaehlt b { color: #FFAA00; }
  label.zeile { display: block; padding: 9px 0; border-bottom: 1px solid #2a2a2a; }
  label.zeile input { transform: scale(1.3); margin-right: 10px; }
  .fortschritt { height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin: 8px 0; }
  #leiste { position: sticky; top: 0; z-index: 5; background: #2a2000; margin: -16px -16px 12px; padding: 4px 16px 10px; border-bottom: 1px solid #FFAA00; }
  #leiste button { margin-right: 10px; }
  .fortschritt div { height: 100%; background: #FFAA00; width: 0; }
</style>
</head>
<body>
<div id="leiste" style="display:none"></div>
<div id="app"></div>

<script>
/*LOGIK*/
var ZUSTAND = /*ZUSTAND*/null;   // wird vom Handy-Skript beim Öffnen eingesetzt
var API = 'https://api.transitous.org/api/';
var MAXS = 8;
var SCHRIFT = (ZUSTAND && ZUSTAND.schrift) || {};
var L = Logik(holen, SCHRIFT);    // gemeinsame Logik mit dem Uhr-Menü (src/pkjs/logik.js)
var sortDe = L.sortDe, entfernung = L.entfernung, ledText = L.ledText, breite = L.breite, stadtVon = L.stadtVon,
    kurzname = L.kurzname, erreichbar = L.erreichbar, direkt = L.direkt;

var strecken = (ZUSTAND && ZUSTAND.strecken) ? ZUSTAND.strecken.slice() : [];
var ansicht = 'liste';             // 'liste' oder 'editor'
var e = null;                      // Entwurf der Seite im Editor
var rmvKey = (ZUSTAND && ZUSTAND.rmvKey) || '';
var rmvTest = '';
var dbId = (ZUSTAND && ZUSTAND.dbId) || '', dbKey = (ZUSTAND && ZUSTAND.dbKey) || '', dbTest = '';   // DB Timetables (0.9.0)
function layoutWahl(v) { return v === 'phosphor' || v === 'phosphor_weiss' ? 'phosphor_weiss' : 'papier'; }   // seit 0.13.0 nur zwei Ansichten
var layout = layoutWahl(ZUSTAND && ZUSTAND.layout);   // Ansicht auf der Uhr
var inversWert = !!(ZUSTAND && ZUSTAND.invers), kontrastWert = !!(ZUSTAND && ZUSTAND.kontrast);   // Farben (0.9.1)
var schliessenWert = !!(ZUSTAND && ZUSTAND.schliessen);   // App nach 10 s ohne Taste zu (0.9.2, Standard aus)
var umkreisWert = L.UMKREISE.indexOf(ZUSTAND && ZUSTAND.umkreis) >= 0 ? ZUSTAND.umkreis : 1000;   // Umkreis um den Start
var abfahrtWert = (ZUSTAND && ZUSTAND.abfahrt) === 'aktuell' ? 'aktuell' : 'plan';   // Abfahrtszeit auf der Uhr
var dauerWert = (ZUSTAND && ZUSTAND.dauer) === 'aus' ? 'aus' : 'an';                // Fahrtdauer auf der Uhr
var quelleWert = ['rmv', 'trans'].indexOf(ZUSTAND && ZUSTAND.quelle) >= 0 ? ZUSTAND.quelle : 'auto';   // Quelle der Abfahrten
// Seit 0.6.1: Strecken (von Standort oder Favorit zu einem Favoriten), Favoriten (seit 0.8.0 bis 20), Verbindungssuche
var MAXR = 8, MAXF = 20;
// Rückfrage auf der Seite selbst (0.13.1): confirm() und alert() zeigt die Pebble-App auf Android nicht an, confirm()
// gilt dort als Nein — Löschen tat nichts (GitHub-Issue #1). Schlüssel der offenen Frage: h3, r2, f5, alle-<rubrik>, e4
var frage = '';
var ersetzen = null;               // Voll (0.8.0): { art: 'seite' | 'strecke' | 'favorit', neu, hin, liste: [{ t, i }] }
function favReihe() {              // Favoriten nach Häufigkeit wie auf der Uhr (Index ins Feld)
  return favoriten.map(function (f, i) { return i; }).sort(function (a, b) {
    return (favoriten[b].n || 0) - (favoriten[a].n || 0) || sortDe(favoriten[a].klar || '', favoriten[b].klar || '');
  });
}
var routen = (ZUSTAND && ZUSTAND.routen) ? ZUSTAND.routen.slice() : [];
var favoriten = (ZUSTAND && ZUSTAND.favoriten) ? ZUSTAND.favoriten.slice() : [];
var umstiegeWert = [0, 1, 2, 3, 9].indexOf(ZUSTAND && ZUSTAND.umstiege) >= 0 ? ZUSTAND.umstiege : 2;
var fusswegWert = [5, 10, 15, 20].indexOf(ZUSTAND && ZUSTAND.fussweg) >= 0 ? ZUSTAND.fussweg : 15;
var umstzeitWert = [2, 5, 10].indexOf(ZUSTAND && ZUSTAND.umstzeit) >= 0 ? ZUSTAND.umstzeit : 2;
var r = null;                      // Entwurf einer Strecke { von (Index Favorit, -1 = Standort), nach (Index) }
var favSuche = { text: '', treffer: [], fehler: null };
function kmText(m) { return m >= 1000 ? (m / 1000) + ' km' : m + ' m'; }

// ---------- Hilfsfunktionen ----------
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function holen(pfad, fertig) {
  var x = new XMLHttpRequest();
  x.open('GET', API + pfad, true);
  x.onload = function () {
    if (x.status !== 200) return fertig('HTTP ' + x.status);
    try { fertig(null, JSON.parse(x.responseText)); } catch (err) { fertig('Antwort unlesbar'); }
  };
  x.onerror = function () { fertig('kein Netz'); };
  x.send();
}

// ---------- Hauptmenü und Unterseiten (seit 0.6.4) ----------
// Eine Konfigurationsseite kann Daten nur beim Schließen übergeben. 0.6.4–0.8.0 schloss sie sich nach jeder Änderung und
// sollte sich wieder öffnen — das lässt die Pebble-App nicht zu (Seb 2026-10-10: man landet im Pebble-Menü). Seit 0.8.1:
// Änderungen werden vorgemerkt, die Leiste oben zeigt „Speichern“. Android-Zurück geht eine Ebene hoch und speichert
// ganz oben; geht die Seite in den Hintergrund, wird ebenfalls gespeichert (beides nur, wenn die Pebble-App es weitergibt).
var unterseite = (ZUSTAND && ZUSTAND.unterseite) || '';
var UNTERSEITEN = [['haltestellen', 'Abfahrten'], ['strecken', 'Strecken'], ['favoriten', 'Favoriten'],
                   ['anzeige', 'Anzeige auf der Uhr'], ['suche', 'Verbindungssuche'], ['daten', 'Datenquelle und Umkreis']];
function daten() {
  return { strecken: strecken, rmvKey: rmvKey, dbId: dbId, dbKey: dbKey, layout: layout, invers: inversWert, kontrast: kontrastWert, schliessen: schliessenWert, umkreis: umkreisWert, quelle: quelleWert, abfahrt: abfahrtWert, dauer: dauerWert,
           routen: routen, favoriten: favoriten, umstiege: umstiegeWert, fussweg: fusswegWert, umstzeit: umstzeitWert };
}
var geaendert = false;
function vormerken() { geaendert = true; leisteZeigen(); }
function leisteZeigen() {
  var l = $('leiste');
  if (!l) return;
  l.style.display = geaendert ? 'block' : 'none';
  l.innerHTML = '<button class="haupt" data-a="speichern">Speichern</button><span class="klein">Nicht gespeichert — schickt alles an die Uhr und schließt</span>';
}
function namenFokus(i) {                 // neuer Favorit: gleich den Namen eintippen können
  var inp = document.querySelector && document.querySelector('[data-fname="' + i + '"]');
  if (!inp) return;
  if (inp.scrollIntoView) inp.scrollIntoView({ block: 'center' });
  inp.focus(); inp.select();
}
function hauptHtml() {
  var kurz = {
    haltestellen: strecken.length + ' von ' + MAXS, strecken: routen.length + ' von ' + MAXR, favoriten: favoriten.length + ' von ' + MAXF,
    anzeige: { phosphor_weiss: 'Phosphor', papier: 'Papier' }[layout] + (inversWert ? ', invertiert' : '') + (kontrastWert && layout !== 'papier' ? ', hoher Kontrast' : '') + (schliessenWert ? ', schließt nach 10 s' : '') + (abfahrtWert === 'aktuell' ? ', Zeit aktuell' : ''),
    suche: (umstiegeWert === 9 ? 'Umstiege beliebig' : 'höchstens ' + umstiegeWert + ' Umstiege') + ', ' + fusswegWert + ' min Fußweg',
    daten: { auto: 'Auto', rmv: 'nur RMV', trans: 'nur Transitous' }[quelleWert] + (rmvKey ? ' mit RMV-Schlüssel' : ' ohne RMV-Schlüssel') + (dbId && dbKey ? ', DB für Züge' : '') + ', Umkreis ' + kmText(umkreisWert)
  };
  return '<h1>Linie 8</h1><div class="klein">Änderungen gehen erst mit <b>Speichern</b> (oben) an die Uhr. ' +
    'Auf der Uhr wechselt Hoch/Runter lang zwischen <b>Abfahrten</b> und <b>Strecken</b>.</div><ul class="menue">' +
    UNTERSEITEN.map(function (u) {
      return '<li data-a="geh" data-s="' + u[0] + '"><b>' + u[1] + '</b><span class="pfeil">›</span><br><span class="klein">' + esc(kurz[u[0]]) + '</span></li>';
    }).join('') + '</ul><button data-a="speichern">' + (geaendert ? 'Speichern und schließen' : 'Schließen') + '</button>';
}
function zeigeListe() {
  ansicht = 'liste';
  var titel = (UNTERSEITEN.filter(function (u) { return u[0] === unterseite; })[0] || [])[1];
  var inhalt = { haltestellen: haltestellenHtml, strecken: routenHtml, favoriten: favoritenHtml, anzeige: anzeigeHtml, suche: suchHtml, daten: datenHtml }[unterseite];
  if (ersetzen) { $('app').innerHTML = ersetzenHtml(); return; }
  $('app').innerHTML = inhalt ? '<button class="klein" data-a="uebersicht">‹ Übersicht</button><h1>' + titel + '</h1>' + inhalt() : hauptHtml();
  if ($('rmvKey')) { $('rmvKey').oninput = function () { rmvKey = this.value.trim(); vormerken(); }; $('rmvKey').onchange = vormerken; }
  if ($('dbId')) { $('dbId').oninput = function () { dbId = this.value.trim(); vormerken(); }; $('dbId').onchange = vormerken; }
  if ($('dbKey')) { $('dbKey').oninput = function () { dbKey = this.value.trim(); vormerken(); }; $('dbKey').onchange = vormerken; }
  listeVerdrahten();
  leisteZeigen();
}
// Voll (0.8.0): erst beim Anlegen fragen, was ersetzt wird; die gewählte fällt weg, die neue kommt an ihren Platz
function ersetzenHtml() {
  return '<h1>Voll: welche ersetzen?</h1><div class="klein">Die gewählte fällt weg, die neue kommt ans Ende' +
    (ersetzen.art === 'favorit' ? '. Selten genutzte stehen oben.' : ' (eine Rückfahrt hinter ihre Hinfahrt).') + '</div><ul class="menue">' +
    ersetzen.liste.map(function (x, k) {
      return '<li data-a="frage" data-k="e' + k + '">' + esc(x.t) + '</li>' +
        (frage === 'e' + k ? '<li class="gewaehlt">' + frageHtml('e' + k, x.t + ' ersetzen?', 'Ja, ersetzen') + '</li>' : '');
    }).join('') +
    '</ul><button data-a="ersetzenweg">Abbrechen</button>';
}
function seitenName(s) { return s.a.kurz + (s.b ? ' → ' + s.b.kurz : ''); }
function routenName(x) { return (x.von ? x.von.klar : 'Hier') + ' → ' + x.nach.klar; }
function frageHtml(k, text, ja) {        // offene Rückfrage: Text, „Ja“ und „Nein“ an Ort und Stelle
  return '<div class="hinweis">' + esc(text) + '</div><button class="haupt" data-a="ja" data-k="' + k + '">' + ja + '</button>' +
    '<button data-a="nein">Nein</button>';
}
function loeschKnopf(k, text, extra) {
  if (frage === k) return frageHtml(k, text, 'Ja, löschen');
  return '<button class="klein" data-a="frage" data-k="' + k + '"' + (extra || '') + '>Löschen</button>';
}
function alleLoeschenKnopf(art, n) {
  if (!n) return '';
  var wort = art === 'strecken' ? 'Strecken' : art === 'favoriten' ? 'Favoriten' : 'Abfahrten';
  if (frage === 'alle-' + art) return frageHtml('alle-' + art, 'Alle ' + n + ' ' + wort + ' löschen?', 'Ja, alle löschen');
  return '<button class="klein" data-a="frage" data-k="alle-' + art + '">Alle ' + n + ' löschen</button>';
}
function haltestellenHtml() {
  var h = '<div class="klein"><b>Du weißt, wie du fährst. Die App sagt dir, wann.</b> ' +
    'Abfahrten ab einer Haltestelle, ohne Umstieg — mit Ausstieg samt Ankunft und Fahrtdauer, ohne Ausstieg mit dem Endziel jeder Fahrt. ' +
    'Die Rückfahrt legst du an der Uhr an: Select lang → Rückfahrt.</div>';
  if (!strecken.length) h += '<div class="klein">Noch keine Abfahrt angelegt.</div>';
  strecken.forEach(function (s, i) {
    h += '<div class="karte"><b>' + esc(s.a.kurz) + (s.b ? ' → ' + esc(s.b.kurz) : '') + '</b><br>' +
      '<span class="klein">ab ' + esc(s.a.name) + (s.b ? '<br>Ausstieg ' + esc(s.b.name) : '<br>ohne Ausstieg: alle Abfahrten mit Endziel') + '</span><br>' +
      (s.alle ? '<span class="klein">alle Linien </span>' : '') +
      s.linien.map(function (l) { return '<span class="marke">' + esc(l) + '</span>'; }).join('') + '<br>' +
      '<button class="klein" data-a="hoch" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
      '<button class="klein" data-a="runter" data-i="' + i + '"' + (i === strecken.length - 1 ? ' disabled' : '') + '>▼</button>' +
      '<button class="klein" data-a="bearbeiten" data-i="' + i + '">Ändern</button>' +
      loeschKnopf('h' + i, seitenName(s) + ' löschen?') + '</div>';
  });
  h += '<button data-a="neu">+ Neu anlegen</button>' + alleLoeschenKnopf('haltestellen', strecken.length);
  if (strecken.length >= MAXS) h += '<div class="klein">Voll (' + MAXS + '): beim Anlegen wählst du, welche ersetzt wird.</div>';
  return h;
}
function anzeigeHtml() {
  return '<h3>Ansicht</h3>' +
    [['papier', 'Papier', 'Standard. Schwarz auf Weiß, fette Systemschrift, große Ziffern, Namen mit Umlauten — am besten lesbar'],
     ['phosphor_weiss', 'Phosphor', 'Weiße Pixelschrift auf Schwarz wie das Watchface Phosphor']].map(function (v) {
      return '<label class="zeile"><input type="radio" name="layout" data-a="layout" value="' + v[0] + '"' + (layout === v[0] ? ' checked' : '') + '>' +
        '<b>' + v[1] + '</b><br><span class="klein">' + v[2] + '</span></label>';
    }).join('') +
    '<h3>Farben</h3>' +
    [['invers', 'Invertiert', 'Papier wird weiß auf Schwarz, Phosphor dunkel auf Hell', inversWert],
     ['kontrast', 'Hoher Kontrast', 'Nur Phosphor (Papier hat nie Grau): keine graue oder blasse Schrift, farbige Hinweise bleiben', kontrastWert],
     ['schliessen', 'App nach 10 s schließen', 'Ohne Tastendruck zurück zum Watchface (nicht beim Laden und in der aktiven Fahrt). Aus: Linie 8 bleibt offen', schliessenWert]].map(function (v) {
      return '<label class="zeile"><input type="checkbox" data-a="' + v[0] + '"' + (v[3] ? ' checked' : '') + '>' +
        '<b>' + v[1] + '</b><br><span class="klein">' + v[2] + '</span></label>';
    }).join('') +
    '<h3>Abfahrtszeit</h3>' +
    [['plan', 'Fahrplan', 'Standard. Planzeit, Verspätung klein dahinter (+2\')'],
     ['aktuell', 'Aktuell', 'Zeit mit Verspätung; in Klar orange, in Phosphor gelb. Restminuten zählen immer mit Verspätung']].map(function (v) {
      return '<label class="zeile"><input type="radio" name="abfahrt" data-a="abfahrtWert" value="' + v[0] + '"' + (abfahrtWert === v[0] ? ' checked' : '') + '>' +
        '<b>' + v[1] + '</b><br><span class="klein">' + v[2] + '</span></label>';
    }).join('') +
    '<h3>Fahrtdauer</h3>' +
    '<label class="zeile"><input type="checkbox" data-a="dauerWert"' + (dauerWert === 'an' ? ' checked' : '') + '>' +
    '<b>Fahrtdauer bis zum Ausstieg zeigen</b><br><span class="klein">Standard an. Minuten je Abfahrt, gedimmt; entfällt ohnehin, wenn kein Platz ist</span></label>' +
    '<div class="klein">Alles auch an der Uhr: Select lang → Einstellungen → Anzeige.</div>';
}
function datenHtml() {
  return '<h3>Datenquelle</h3><div class="klein">Optional: eigener RMV-Schlüssel (accessId, kostenlos bei RMV Open Data). ' +
    'Mit Schlüssel kommen die Abfahrten vom RMV, mit Echtzeit; klappt das nicht, von Transitous (nur Fahrplan). ' +
    'Auf der Uhr steht unten RMV oder TRANS vor der Uhrzeit.</div>' +
    '<input type="text" id="rmvKey" placeholder="RMV-Schlüssel (leer = nur Transitous)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="' + esc(rmvKey) + '">' +
    '<button data-a="rmvTest">Schlüssel prüfen</button><div class="klein" id="rmvErg">' + esc(rmvTest) + '</div>' +
    [['auto', 'Auto', 'RMV mit Schlüssel, bei Fehler Transitous'],
     ['rmv', 'Nur RMV', 'kein Wechsel — ohne Schlüssel oder bei Störung steht FEHLER auf der Uhr'],
     ['trans', 'Nur Transitous', 'nur Fahrplan, schont das RMV-Kontingent']].map(function (v) {
      return '<label class="zeile"><input type="radio" name="quelle" data-a="quelleWert" value="' + v[0] + '"' + (quelleWert === v[0] ? ' checked' : '') + '>' +
        '<span><b>' + v[1] + '</b> <span class="klein">' + v[2] + '</span></span></label>';
    }).join('') +
    '<h3>DB-Echtzeit für Züge</h3><div class="klein">Optional: eigener Zugang zur DB-Schnittstelle „Timetables“ (kostenlos im DB API Marketplace, ' +
    'Anwendung anlegen und Timetables abonnieren). Dann kommen bei <b>Zügen</b> Zeit, Gleis und Ausfall von der DB — zusätzlich zur Quelle oben, ' +
    'auch außerhalb des RMV. Bus und Tram bleiben wie oben. Auf der Uhr steht dann RMV+DB bzw. TR+DB.</div>' +
    '<input type="text" id="dbId" placeholder="DB Client-ID (leer = ohne DB)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="' + esc(dbId) + '">' +
    '<input type="text" id="dbKey" placeholder="DB API-Key (Client Secret)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="' + esc(dbKey) + '">' +
    '<button data-a="dbTest">DB-Zugang prüfen</button><div class="klein" id="dbErg">' + esc(dbTest) + '</div>' +
    '<h3>Umkreis</h3><div class="klein">So weit läufst du höchstens: bei der Rückfahrt mit Ankunft im Umkreis um den Start, ' +
    'bei „Alle in der Nähe“ als Haltestelle und für den Vorschlag „früher da“ (nur, wenn du so nah am Start einer Abfahrt oder Strecke stehst). ' +
    'Normal endet die Rückfahrt genau am Start.</div>' +
    L.UMKREISE.map(function (m) {
      return '<label class="zeile"><input type="radio" name="umkreis" data-a="umkreisWert" value="' + m + '"' + (umkreisWert === m ? ' checked' : '') + '>' +
        '<b>' + kmText(m) + '</b>' + (m === 1000 ? ' <span class="klein">Standard</span>' : '') + '</label>';
    }).join('') +
    '<div class="klein">Auch an der Uhr: Select lang → Einstellungen → Umkreis.</div>';
}

// ---------- Strecken, Favoriten, Verbindungssuche (0.6.1) ----------
function ortNeu(name, stadt, lat, lon, typ, id) {        // wie ortNeu im Handy-Skript
  var st = typ === 'halt' ? stadtVon(name) : '';
  return { name: name, stadt: stadt || st, kurz: L.utf8Kuerzen(kurzname(name, st), 31), klar: L.utf8Kuerzen(L.klarname(name, st), 31),
           lat: lat, lon: lon, typ: typ, id: id || null, n: 0 };
}
function kopie(o) { return JSON.parse(JSON.stringify(o)); }
function routenHtml() {
  var h = '<div class="klein"><b>Du weißt, wohin du willst. Die App sagt dir, wie.</b> ' +
    'Start ist „Hier“ (dein Standort) oder ein Favorit, Ziel ein Favorit. ' +
    'Auf der Uhr: die nächsten drei Verbindungen, Select zeigt den Weg mit Umstiegen und Fußwegen. Neue Ziele zuerst unten als Favorit anlegen ' +
    '— oder an der Uhr: Select lang → Neu anlegen → Suchen.</div>';
  if (!routen.length) h += '<div class="klein">Noch keine Strecke angelegt.</div>';
  routen.forEach(function (x, i) {
    h += '<div class="karte"><b>' + esc(x.von ? x.von.klar : 'Hier') + ' → ' + esc(x.nach.klar) + '</b><br>' +

// ---------- Ansicht: Editor ----------
function neuerEntwurf(s) {
  e = s ? JSON.parse(JSON.stringify(s)) : { a: null, b: null, alle: true, linien: [] };
  e.ohne = !!(s && !s.b);          // Seite ohne Ziel (seit 0.50)
  e.wahlLinie = null;              // Schritt 2: null = noch offen, '*' = alle Linien
  e.wahlRichtung = null;           // Schritt 2b: null = noch offen, -1 = alle Halte A-Z, sonst Index in L.richtungen
  e.erg = null; e.lade = null; e.filter = ''; e.suche = []; e.sucheText = ''; e.pruef = null; e.auswahl = [];
  if (s) {
    e.wahlLinie = '*';
    e.vorAuswahl = s.alle ? null : s.linien.slice();
  }
}

function zeigeEditor() {
  ansicht = 'editor';
  var h = '<h1>Abfahrt ' + (e.index === undefined ? 'neu anlegen' : 'ändern') + '</h1>';

      '<button data-a="nah">In meiner Nähe</button><ul>' +
      e.suche.map(function (t, i) {

  if (e.a && !e.b && !e.ohne) {
    h += '<h2>2 · Linie</h2>';
    if (e.lade) {
      h += '<div class="klein">Lade Fahrtverläufe ab ' + esc(e.a.name) + ' … ' + e.lade[0] + ' / ' + e.lade[1] + '</div>' +
        '<div class="fortschritt"><div style="width:' + (e.lade[1] ? Math.round(100 * e.lade[0] / e.lade[1]) : 0) + '%"></div></div>';
    } else if (e.ergFehler) {

    } else if (e.erg) {

        }).join('') + '</ul>';
    }
  }

  // 2b Richtung (seit 0.35): nur bei einer Linie mit mehreren Richtungen; danach Ziele in Fahrtreihenfolge

  var ok = e.a && e.auswahl.length && (e.ohne ? !!e.erg : !!(e.b && e.pruef && e.pruef.fertig && !e.pruef.fehler && e.pruef.hin.length));

// ---------- Ablauf im Editor ----------
var wartet = null;
function sucheEingabe() {
  var q = this.value.trim(); e.sucheText = this.value;
  clearTimeout(wartet);
  if (q.length < 2) return;
  wartet = setTimeout(function () {
    holen('v1/geocode?type=STOP&text=' + encodeURIComponent(q), function (f, d) {
      e.sucheFehler = f ? 'Suche: ' + f : null;
      e.suche = f ? [] : d.filter(function (t) { return t.type === 'STOP'; }).slice(0, 12);
      var pos = $('sucheStart') ? $('sucheStart').selectionStart : 0;
      zeigeEditor();
      var el = $('sucheStart'); if (el) { el.focus(); el.setSelectionRange(pos, pos); }
    });
  }, 300);
}

function naheSuchen() {
  var s = ZUSTAND && ZUSTAND.standort;
  if (!s) { e.sucheFehler = 'Standort nicht verfügbar (' + ((ZUSTAND && ZUSTAND.standortFehler) || 'unbekannt') + ')'; return zeigeEditor(); }
  L.naechsteHaltestellen(s.lat, s.lon, 10, function (f, d) {
    e.sucheFehler = f ? 'Suche: ' + f : null;
    e.suche = f ? [] : d;
    zeigeEditor();
  });
}

function startGewaehlt(t) {
  e.a = { id: t.id, name: t.name, kurz: kurzname(t.name, stadtVon(t.name)), lat: t.lat, lon: t.lon };
  e.b = null; e.ohne = false; e.erg = null; e.wahlLinie = null; e.wahlRichtung = null; e.pruef = null; e.filter = '';
  ladeErreichbar();
}

function ladeErreichbar() {
  e.lade = [0, 0]; e.ergFehler = null; zeigeEditor();
  erreichbar(e.a, function (n, gesamt) { e.lade = [n, gesamt]; zeigeEditor(); }, function (f, erg) {
    e.lade = null;
    if (f) e.ergFehler = 'Konnte Fahrten nicht laden: ' + f; else e.erg = erg;
    if (e.erg && e.ohne) linienNeu();
    zeigeEditor();
  });
}

function zielGewaehlt(z) {
  holen('v1/reverse-geocode?type=STOP&place=' + z.lat + ',' + z.lon, function (f, d) {   // Haltestellen-ID für die Abfrage
    var best = null, bm = 1e9;
    if (!f) d.forEach(function (t) {
      if (t.type !== 'STOP') return;
      var m = entfernung(z.lat, z.lon, t.lat, t.lon) - (t.name === z.name ? 1000 : 0);
      if (m < bm) { bm = m; best = t; }
    });
    if (!best) { e.ergFehler = 'Zu dieser Haltestelle wurde keine Kennung gefunden.'; e.erg = null; return zeigeEditor(); }
    e.b = { id: best.id, name: z.name, kurz: kurzname(z.name, stadtVon(e.a.name)), lat: z.lat, lon: z.lon };
    e.ohne = false;
    e.zielLinien = Object.keys(z.linien); e.zielHin = z.hin; e.zielRueck = z.rueck;
    pruefen();
  });
}

function alleLinien() {
  if (e.ohne) return e.erg ? Object.keys(e.erg.linien).sort(sortDe) : [];
  return ((e.pruef && e.pruef.hin) || []).slice().sort(sortDe);
}

function linienNeu() {                 // Vorauswahl: gewählte Linie aus Schritt 2, sonst alle
  var alle = alleLinien(), vor = (e.wahlLinie && e.wahlLinie !== '*') ? e.wahlLinie : null;
  if (e.vorAuswahl) {
    e.auswahl = alle.filter(function (l) { return e.vorAuswahl.indexOf(l) >= 0; });
    e.vorAuswahl = null;
    if (!e.auswahl.length) e.auswahl = alle.slice();
  } else {
    e.auswahl = alle.filter(function (l) { return !vor || l === vor; });
    if (!e.auswahl.length) e.auswahl = alle.slice();   // gewählte Linie fährt nicht direkt hin: alle vorschlagen
  }
}

function koord(h, fertig) {             // ältere Einrichtungen ohne Koordinaten
  if (h.lat !== undefined) return fertig(null);
  holen('v1/geocode?type=STOP&text=' + encodeURIComponent(h.name), function (f, d) {
    var t = !f && d.filter(function (x) { return x.type === 'STOP'; })[0];
    if (!t) return fertig('nicht gefunden: ' + h.name);
    h.lat = t.lat; h.lon = t.lon; fertig(null);
  });
}

function pruefen() {
  e.pruef = { fertig: false }; zeigeEditor();
  koord(e.a, function (f0) { koord(e.b, function (f1) {
    if (f0 || f1) { e.pruef = { fertig: true, fehler: f0 || f1 }; return zeigeEditor(); }
    direkt(e.a.id, e.b.id, function (f, l) {
      if (f) e.pruef = { fertig: true, fehler: 'Prüfung fehlgeschlagen: ' + f };
      else {
        if (e.zielHin) (e.zielLinien || []).forEach(function (x) { if (l.indexOf(x) < 0) l.push(x); });   // auch selten fahrende Linien
        e.pruef = { fertig: true, hin: l.sort(sortDe) };
      }
      linienNeu(); zeigeEditor();
    });
  }); });
}

// Seite übernehmen (seit 0.50): { a, b (null = ohne Ziel), linien, alle }
function uebernehmen() {
  var s = {
    a: { id: e.a.id, name: e.a.name, kurz: e.a.kurz, lat: e.a.lat, lon: e.a.lon },
    b: e.ohne ? null : { id: e.b.id, name: e.b.name, kurz: e.b.kurz, lat: e.b.lat, lon: e.b.lon },
    linien: e.auswahl.slice().sort(sortDe),
    alle: e.auswahl.length === alleLinien().length
  };
  if (e.zuletzt) s.zuletzt = e.zuletzt;
  unterseite = 'haltestellen';
  if (e.index === undefined && strecken.length >= MAXS) {      // voll (0.8.0): fragen, welche ersetzt wird
    ersetzen = { art: 'seite', neu: s, liste: strecken.map(function (x, i) { return { t: seitenName(x), i: i }; }) };
    return zeigeListe();
  }
  if (e.index === undefined) strecken.push(s); else strecken[e.index] = s;
  vormerken();
  zeigeListe();
}

function schliessen(daten) {
  document.location = 'pebblejs://close#' + encodeURIComponent(JSON.stringify(daten));
}

// „Ja“ einer Rückfrage (0.13.1): h<i> Abfahrt, r<i> Strecke, f<i> Favorit, alle-<rubrik>, e<i> Eintrag der Ersetzen-Liste
function frageJa(k) {
  frage = '';
  var i = parseInt(k.slice(1), 10);
  if (k.indexOf('alle-') === 0) {                     // Alle löschen (0.8.0), je Rubrik und Favoriten
    var art = k.slice(5), liste = art === 'strecken' ? routen : art === 'favoriten' ? favoriten : strecken;
    liste.splice(0, liste.length); vormerken(); return zeigeListe();
  }
  if (k[0] === 'h' && strecken[i]) { strecken.splice(i, 1); vormerken(); }
  else if (k[0] === 'r' && routen[i]) { routen.splice(i, 1); vormerken(); }
  else if (k[0] === 'f' && favoriten[i]) { favoriten.splice(i, 1); vormerken(); }
  else if (k[0] === 'e' && ersetzen && ersetzen.liste[i]) {
    var x = ersetzen.liste[i];
    if (ersetzen.art === 'favorit') { favoriten.splice(x.i, 1); favoriten.push(ersetzen.neu); favSuche = { text: '', treffer: [], fehler: null }; }
    else if (ersetzen.art === 'strecke') {
      routen.splice(x.i, 1);
      var hin = ersetzen.hin, pos = hin === undefined ? routen.length : (x.i === hin ? x.i : hin > x.i ? hin : hin + 1);
      routen.splice(pos, 0, ersetzen.neu);
    } else { strecken.splice(x.i, 1); strecken.push(ersetzen.neu); }
    var warFav = ersetzen.art === 'favorit';
    ersetzen = null; r = null; vormerken(); zeigeListe();
    return warFav ? namenFokus(favoriten.length - 1) : undefined;
  }
  return zeigeListe();
}

// ---------- Klicks ----------
document.addEventListener('click', function (ev) {
  var el = ev.target;
  while (el && el !== document && !el.getAttribute('data-a')) el = el.parentNode;
  if (!el || el === document) return;
  var a = el.getAttribute('data-a'), i = parseInt(el.getAttribute('data-i'), 10);
  if (a === 'frage') { frage = el.getAttribute('data-k'); return zeigeListe(); }
  if (a === 'nein') { frage = ''; return zeigeListe(); }
  if (a === 'ja') return frageJa(el.getAttribute('data-k'));
  frage = '';                                         // jede andere Aktion schließt die offene Frage
  if (a === 'lin') {
    var l = el.value, k = e.auswahl.indexOf(l);
    if (el.checked && k < 0) e.auswahl.push(l);
    if (!el.checked && k >= 0) e.auswahl.splice(k, 1);
    return zeigeEditor();
  }
  if (a === 'geh') { unterseite = el.getAttribute('data-s'); return zeigeListe(); }
  if (a === 'uebersicht') { unterseite = ''; r = null; return zeigeListe(); }
  if (a === 'neu') { neuerEntwurf(null); return zeigeEditor(); }
  if (a === 'bearbeiten') { neuerEntwurf(strecken[i]); e.index = i; return e.ohne ? ladeErreichbar() : pruefen(); }
  if (a === 'ohneZiel') { e.ohne = true; e.b = null; e.pruef = null; linienNeu(); return zeigeEditor(); }
  if (a === 'umkreisWert') { umkreisWert = parseInt(el.value, 10) || 1000; return vormerken(); }
  if (a === 'abfahrtWert') { abfahrtWert = el.value === 'aktuell' ? 'aktuell' : 'plan'; return vormerken(); }
  if (a === 'dauerWert') { dauerWert = el.checked ? 'an' : 'aus'; return vormerken(); }
  if (a === 'quelleWert') { quelleWert = ['rmv', 'trans'].indexOf(el.value) >= 0 ? el.value : 'auto'; return vormerken(); }
  if (a === 'ersetzenweg') { ersetzen = null; return zeigeListe(); }
  if (a === 'hoch' && i > 0) { strecken.splice(i - 1, 0, strecken.splice(i, 1)[0]); vormerken(); return zeigeListe(); }
  if (a === 'runter' && i < strecken.length - 1) { strecken.splice(i + 1, 0, strecken.splice(i, 1)[0]); vormerken(); return zeigeListe(); }
  if (a === 'layout') { layout = layoutWahl(el.value); return vormerken(); }
  if (a === 'invers') { inversWert = !!el.checked; return vormerken(); }
  if (a === 'kontrast') { kontrastWert = !!el.checked; return vormerken(); }
  if (a === 'schliessen') { schliessenWert = !!el.checked; return vormerken(); }
  if (a === 'speichern') return schliessen(daten());   // Leiste oder Schließen: alles übergeben, Seite zu
  // Strecken und Favoriten (0.6.1)
  if (a === 'rneu') { r = { von: -1, nach: 0 }; return zeigeListe(); }
  if (a === 'rweg') { r = null; return zeigeListe(); }
  if (a === 'rok') {
    var nach = favoriten[r.nach];
    if (!nach) return;
    var neuR = { von: r.von >= 0 && r.von !== r.nach ? kopie(favoriten[r.von]) : null, nach: kopie(nach), zuletzt: Math.floor(Date.now() / 1000) };
    if (routen.length >= MAXR) { ersetzen = { art: 'strecke', neu: neuR, liste: routen.map(function (x, k) { return { t: routenName(x), i: k }; }) }; return zeigeListe(); }
    routen.push(neuR);
    r = null; vormerken(); return zeigeListe();
  }
  if (a === 'rhoch' && i > 0) { routen.splice(i - 1, 0, routen.splice(i, 1)[0]); vormerken(); return zeigeListe(); }
  if (a === 'rrunter' && i < routen.length - 1) { routen.splice(i + 1, 0, routen.splice(i, 1)[0]); vormerken(); return zeigeListe(); }
  if (a === 'rrueck') {
    var rueck = { von: kopie(routen[i].nach), nach: kopie(routen[i].von), zuletzt: Math.floor(Date.now() / 1000) };
    if (routen.length >= MAXR) { ersetzen = { art: 'strecke', neu: rueck, hin: i, liste: routen.map(function (x, k) { return { t: routenName(x), i: k }; }) }; return zeigeListe(); }
    routen.splice(i + 1, 0, rueck); vormerken(); return zeigeListe();
  }
  if (a === 'fneu') {
    var fn = favSuche.treffer[i];
    if (!fn) return;
    if (favoriten.length >= MAXF) {                 // voll: selten genutzte oben
      var auf = favoriten.map(function (f, k) { return k; }).sort(function (p, q) { return (favoriten[p].n || 0) - (favoriten[q].n || 0); });
      ersetzen = { art: 'favorit', neu: fn, liste: auf.map(function (k) { return { t: favoriten[k].klar, i: k }; }) };
      return zeigeListe();
    }
    favoriten.push(fn); favSuche = { text: '', treffer: [], fehler: null }; vormerken(); zeigeListe();
    return namenFokus(favoriten.length - 1);
  }
  if (a === 'umstiegeWert') { umstiegeWert = parseInt(el.value, 10); return vormerken(); }
  if (a === 'fusswegWert') { fusswegWert = parseInt(el.value, 10); return vormerken(); }
  if (a === 'umstzeitWert') { umstzeitWert = parseInt(el.value, 10); return vormerken(); }
  if (a === 'rmvTest') return rmvPruefen();
  if (a === 'dbTest') return dbPruefen();
  if (a === 'nah') return naheSuchen();
  if (a === 'start') return startGewaehlt(e.suche[i]);
  if (a === 'startNeu') { e.a = null; e.b = null; e.ohne = false; e.erg = null; e.wahlLinie = null; e.pruef = null; return zeigeEditor(); }
  if (a === 'nochmal') return ladeErreichbar();
  if (a === 'linie') { e.wahlLinie = el.getAttribute('data-l'); e.wahlRichtung = null; e.filter = ''; return zeigeEditor(); }
  if (a === 'richtung') { e.wahlRichtung = i; e.filter = ''; return zeigeEditor(); }
  if (a === 'ziel') return zielGewaehlt(e.erg.ziele[el.getAttribute('data-n')]);
  if (a === 'zielNeu') {
    e.b = null; e.ohne = false; e.pruef = null;
    if (!e.erg) return ladeErreichbar();
    return zeigeEditor();
  }
  if (a === 'pruefen') return pruefen();
  if (a === 'uebernehmen') return uebernehmen();
  if (a === 'verwerfen') return zeigeListe();
});

function zurueckFangen() { try { history.pushState({ l8: 1 }, ''); } catch (err) { console.log('pushState: ' + err); } }
if (typeof window !== 'undefined' && typeof history !== 'undefined') {
  zurueckFangen();
  window.addEventListener('popstate', function () {
    if (ansicht === 'editor' || ersetzen) { ersetzen = null; zurueckFangen(); return zeigeListe(); }
    if (unterseite) { unterseite = ''; r = null; zurueckFangen(); return zeigeListe(); }
    if (geaendert) return schliessen(daten());
    document.location = 'pebblejs://close';
  });
  // Seite verschwindet (X der Pebble-App, App-Wechsel): Vorgemerktes noch übergeben
  document.addEventListener('visibilitychange', function () {

}
